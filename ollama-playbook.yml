- name: Setup dan Jalankan Ollama
  hosts: ollama
  become: yes
  tasks:

    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        executable: /bin/bash

    - name: Cek versi Ollama
      shell: ollama --version
      register: ollama_version
      ignore_errors: true

    - name: Buat folder konfigurasi Ollama
      file:
        path: /etc/ollama
        state: directory
        mode: '0755'

    - name: Tulis ulang file service Ollama agar bisa diakses publik
      copy:
        dest: /etc/systemd/system/ollama.service
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/ollama serve --host 0.0.0.0:11434
          User=ollama
          Group=ollama
          Restart=always
          RestartSec=3
          Environment="PATH=/usr/local/bin:/usr/bin:/bin"

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Ollama

    - name: Enable service agar auto-start saat boot
      systemd:
        name: ollama
        enabled: yes

    - name: Pull TinyLLaMA model
      shell: ollama pull tinyllama
      register: pull_result
      ignore_errors: true

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Restart Ollama
      systemd:
        name: ollama
        state: restarted
