---
- name: Install dan Setup Ollama
  hosts: all
  become: true
  tasks:

    - name: Install dependencies (curl & systemd)
      package:
        name:
          - curl
          - systemd
        state: present

    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        executable: /bin/bash

    - name: Buat service agar bisa diakses publik
      copy:
        dest: /etc/systemd/system/ollama.service
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/ollama serve
          User=ollama
          Group=ollama
          Restart=always
          RestartSec=3
          Environment="OLLAMA_HOST=0.0.0.0:11434"
          Environment="OLLAMA_ORIGINS=*"
          Environment="PATH=/usr/local/bin:/usr/bin:/bin"

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      command: systemctl daemon-reexec

    - name: Aktifkan dan restart layanan Ollama
      systemd:
        name: ollama
        enabled: yes
        state: restarted

    - name: Pull model tinyllama
      shell: ollama pull tinyllama
