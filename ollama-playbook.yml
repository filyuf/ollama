---
- name: Install dan Setup Ollama
  hosts: all
  become: true
  tasks:

    - name: Install dependencies
      package:
        name:
          - curl
          - unzip
          - wget
        state: present

    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        executable: /bin/bash

    - name: Buat systemd service agar bisa diakses publik
      copy:
        dest: /etc/systemd/system/ollama.service
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/ollama serve
          User=ollama
          Group=ollama
          Restart=always
          RestartSec=3
          Environment="OLLAMA_HOST=0.0.0.0:11434"
          Environment="OLLAMA_ORIGINS=*"
          Environment="PATH=/usr/local/bin:/usr/bin:/bin"

          [Install]
          WantedBy=multi-user.target
        mode: '0644'

    - name: Reload systemd daemon
      shell: systemctl daemon-reexec

    - name: Aktifkan dan restart Ollama
      systemd:
        name: ollama
        enabled: yes
        state: restarted

    - name: Tunggu 10 detik agar layanan siap
      wait_for:
        port: 11434
        host: 127.0.0.1
        delay: 5
        timeout: 20
        state: started

    - name: Pull tinyllama model
      shell: /usr/local/bin/ollama pull tinyllama
      register: pull_result
      retries: 3
      delay: 10
      until: pull_result.rc == 0
