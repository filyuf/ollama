- name: Setup dan Jalankan Ollama
  hosts: localhost
  become: yes
  connection: local
  tasks:
    - name: Install Ollama
      shell: curl -fsSL https://ollama.com/install.sh | sh
      args:
        executable: /bin/bash

    - name: Buat file service Ollama agar bisa diakses publik
      copy:
        dest: /etc/systemd/system/ollama.service
        content: |
          [Unit]
          Description=Ollama Service
          After=network-online.target

          [Service]
          ExecStart=/usr/local/bin/ollama serve
          User=root
          Group=root
          Restart=always
          RestartSec=3
          Environment="OLLAMA_HOST=0.0.0.0:11434"
          Environment="OLLAMA_ORIGINS=*"
          Environment="PATH=/usr/local/bin:/usr/bin:/bin"

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Ollama

    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Restart ulang Ollama service
      systemd:
        name: ollama
        state: restarted

    - name: Pull TinyLLaMA
      shell: ollama pull tinyllama || true

  handlers:
    - name: Reload systemd
      command: systemctl daemon-reexec

    - name: Restart Ollama
      systemd:
        name: ollama
        state: restarted
